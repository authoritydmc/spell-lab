# Optional overlay for a reverse-proxy host (Traefik v3).
#
# Usage:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.traefik.yml up -d --build
#
# Attaches the web container to the external proxy network and publishes router labels.
services:
  web:
    networks:
      - spell
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.spell.rule: "Host(`spell.example.com`)"
      traefik.http.routers.spell.entrypoints: "websecure"
      traefik.http.routers.spell.priority: "300"
      traefik.http.routers.spell.middlewares: "gzip-compress@file,security-headers@file"
      traefik.http.routers.spell.tls: "true"
      traefik.http.services.spell.loadbalancer.server.port: "80"

networks:
  proxy:
    external: true
    name: proxy-network
