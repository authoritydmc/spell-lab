# Native (non-container) Nginx config for spell.lab.
# Run as the deploy user: nginx -c <this file> -p /home/raj/spell-lab/deploy/nginx-prefix
#
# The web listener binds to the Docker backend gateway so Traefik can reach it
# while the port is not exposed on the LAN. The Rust API stays on loopback.

worker_processes 1;
pid /home/raj/spell-lab/deploy/nginx.pid;

error_log /home/raj/spell-lab/deploy/logs/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /home/raj/spell-lab/deploy/logs/nginx-access.log;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 512;

    server {
        listen 172.20.0.1:8098;
        server_name localhost spell.example.com;

        root /home/raj/spell-lab/web/dist;
        index index.html;
        charset utf-8;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api/ {
            proxy_pass http://127.0.0.1:8099;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 30s;
        }

        location = /healthz {
            proxy_pass http://127.0.0.1:8099/healthz;
            proxy_set_header Host $host;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
