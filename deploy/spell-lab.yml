# spell-lab — Traefik dynamic configuration example
http:
  services:
    spell-service:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8080"

  routers:
    spell-tls:
      rule: "Host(`spell.example.com`)"
      entryPoints: [websecure]
      service: spell-service
      priority: 300
      middlewares: [gzip-compress, security-headers]
      tls: {}
